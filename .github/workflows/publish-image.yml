name: Publish tested Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag to publish to GHCR
        required: true
        default: '1.0.0'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-gridwise
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Set image reference
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || exit 1
          echo "IMAGE=ghcr.io/${OWNER,,}/bup-cse-preliminary-round:$RELEASE_TAG" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and verify before publication
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --pull --label "org.opencontainers.image.source=$SOURCE_URL" --label "org.opencontainers.image.revision=$COMMIT_SHA" -t "$IMAGE" .
          docker run --rm "$IMAGE" python -m scripts.evaluate_samples --offline
          docker run -d --name gridwise-release -p 8000:8000 -e OPENAI_API_KEY=readiness-placeholder "$IMAGE"
          for _attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Publish and verify registry pull
        run: |
          docker push "$IMAGE"
          docker pull "$IMAGE"
          DIGEST=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          docker run --rm "$DIGEST" python -m scripts.evaluate_samples --offline
          # shellcheck disable=SC2016
          printf '## Published image\n\n`%s`\n\nImmutable reference: `%s`\n\nThe package owner must enable public pulls and verify anonymous access before submission.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Clean up readiness container
        if: always()
        run: docker rm -f gridwise-release || true
